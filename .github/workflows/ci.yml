name: ci

# Runs on the self-hosted runner, not `ubuntu-latest`, because GitHub-hosted minutes are billed on
# private repos and this org's are currently refused for non-payment — every job here was failing to
# start, so this workflow has never actually run. Self-hosted minutes are free and unmetered.
#
# If this repository is ever made public, these jobs move back to hosted runners in the same change:
# a pull request from a fork must never execute on the machine hosting the runner.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The full matrix. Fork semantics, signal delivery and the import system differ enough between
    # versions that "it passes on 3.12" is not evidence about 3.10.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      # `uv`, not actions/setup-python: that action installs into a system tool cache and
      # needs root to do it, which a self-hosted runner running as an ordinary login
      # account cannot give it (`sudo: a password is required`). uv keeps interpreters
      # under the user's own data directory. `--seed` puts pip in the venv.
      - name: Set up Python ${{ matrix.python }}
        run: |
          uv python install ${{ matrix.python }}
          uv venv --seed --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        # No `-e .` and no requirements file: the core ring has zero dependencies and installing it
        # from the built wheel is the only way to notice if that ever stops being true.
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-timeout gevent
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Assert the core ring is still dependency-free
        run: python .github/scripts/assert_no_deps.py
      - name: Test
        # Against the installed wheel, not the source tree, so a missing package or a file left out
        # of the build fails here rather than at a customer's `pip install`.
        run: python -m pytest -q --timeout=180
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ""

  overhead:
    # Separate job on a dedicated runner. The published numbers are only meaningful on a box that
    # is not simultaneously running three other test matrices; see docs/OVERHEAD.md for why the
    # wall-clock tail assertion self-disables when the machine turns out to be busy anyway.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      # `uv`, not actions/setup-python: that action installs into a system tool cache and
      # needs root to do it, which a self-hosted runner running as an ordinary login
      # account cannot give it (`sudo: a password is required`). uv keeps interpreters
      # under the user's own data directory. `--seed` puts pip in the venv.
      - name: Set up Python "3.12"
        run: |
          uv python install "3.12"
          uv venv --seed --python "3.12" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip pytest pytest-timeout
      - name: Measure and assert overhead
        run: python -m pytest tests/test_overhead.py -q -s --timeout=300
        env:
          PYTHONPATH: src
      - name: Publish the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overhead-${{ github.sha }}
          path: overhead-latest.json
          if-no-files-found: warn

  cross-sdk:
    # The cross-SDK conformance suite lives in the Node repository (`conformance/`), and it runs
    # from BOTH sides deliberately. It is one scripted scenario executed through both SDKs, with
    # the emitted event streams diffed field by field and validated against the contract — so a
    # change here that moves a wire shape away from the Node SDK's has to fail *this* build, not
    # only the other one. An instrument that guards one direction guards nothing: the drift would
    # simply land in whichever repository has no job for it.
    #
    # Skips loudly rather than silently when a sibling repository is unavailable, matching how the
    # Node side handles the same problem.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SwfteAI/nexus-sdk-node
          path: .nexus-sdk-node
          token: ${{ secrets.DEVTOOLS_READ_TOKEN }}
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          repository: SwfteAI/nexus-devtools
          path: .nexus-devtools
          token: ${{ secrets.DEVTOOLS_READ_TOKEN }}
        continue-on-error: true
      # `uv`, not actions/setup-python: that action installs into a system tool cache and
      # needs root to do it, which a self-hosted runner running as an ordinary login
      # account cannot give it (`sudo: a password is required`). uv keeps interpreters
      # under the user's own data directory. `--seed` puts pip in the venv.
      - name: Set up Python "3.12"
        run: |
          uv python install "3.12"
          uv venv --seed --python "3.12" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diff the two SDKs' emitted event streams
        run: |
          NODE_SDK="$PWD/.nexus-sdk-node"
          CONTRACT="$PWD/.nexus-devtools/contract/events.v1.json"
          if [ ! -f "$NODE_SDK/conformance/run.mjs" ] || [ ! -f "$CONTRACT" ]; then
            echo "::warning::the Node SDK or the contract was not available; cross-SDK conformance did not run"
            exit 0
          fi
          # The suite drives this checkout through `$NEXUS_PY_SDK/.venv/bin/python`.
          python -m venv .venv
          .venv/bin/python -m pip install -q -e .
          cd "$NODE_SDK"
          NEXUS_PY_SDK="$GITHUB_WORKSPACE" NEXUS_CONTRACT="$CONTRACT" node conformance/run.mjs

  lint:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      # `uv`, not actions/setup-python: that action installs into a system tool cache and
      # needs root to do it, which a self-hosted runner running as an ordinary login
      # account cannot give it (`sudo: a password is required`). uv keeps interpreters
      # under the user's own data directory. `--seed` puts pip in the venv.
      - name: Set up Python "3.12"
        run: |
          uv python install "3.12"
          uv venv --seed --python "3.12" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip ruff
      # The vendor tree is upstream code with upstream style; linting it would produce a diff we
      # must never apply, because a vendored file that differs from upstream for cosmetic reasons
      # is a file nobody can re-sync.
      - run: ruff check src tests --exclude src/nexus/vendor
