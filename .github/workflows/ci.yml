name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The full matrix. Fork semantics, signal delivery and the import system differ enough between
    # versions that "it passes on 3.12" is not evidence about 3.10.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # No `-e .` and no requirements file: the core ring has zero dependencies and installing it
        # from the built wheel is the only way to notice if that ever stops being true.
        run: |
          python -m pip install --upgrade pip build
          python -m pip install pytest pytest-timeout gevent
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Assert the core ring is still dependency-free
        run: python .github/scripts/assert_no_deps.py
      - name: Test
        # Against the installed wheel, not the source tree, so a missing package or a file left out
        # of the build fails here rather than at a customer's `pip install`.
        run: python -m pytest -q --timeout=180
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ""

  overhead:
    # Separate job on a dedicated runner. The published numbers are only meaningful on a box that
    # is not simultaneously running three other test matrices; see docs/OVERHEAD.md for why the
    # wall-clock tail assertion self-disables when the machine turns out to be busy anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pytest-timeout
      - name: Measure and assert overhead
        run: python -m pytest tests/test_overhead.py -q -s --timeout=300
        env:
          PYTHONPATH: src
      - name: Publish the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overhead-${{ github.sha }}
          path: overhead-latest.json
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      # The vendor tree is upstream code with upstream style; linting it would produce a diff we
      # must never apply, because a vendored file that differs from upstream for cosmetic reasons
      # is a file nobody can re-sync.
      - run: ruff check src tests --exclude src/nexus/vendor
