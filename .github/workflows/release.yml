name: release

# MANUAL ONLY. Deliberately not on a tag push: a tag is a statement about the repository, and
# publishing is a statement to the world that cannot be retracted — PyPI does not allow re-uploading
# a version, even a deleted one. Somebody types the version they mean, and a mismatch aborts before
# anything is built.
#
# Runs on a GitHub-hosted runner. The previous version of this comment named the self-hosted Mac and
# the condition that would end that arrangement: "if this repository is ever made public, these jobs
# move back to hosted runners in the same change". The repository is public now, so that is an
# operative fact rather than a future one, and hosted minutes are free and unmetered on public
# repositories — which removes the billing reason the label existed for.
#
# The label was worse than undesirable, it was inoperative: no runner is registered to this
# repository and there are no org-level runners, so dispatching this workflow queued until it
# expired. A release workflow that cannot start is more dangerous than none, because it looks like
# one until the day somebody needs it.
#
# Unlike ci.yml this workflow is `workflow_dispatch` only and never ran a fork's code, so the
# remote-execution argument does not apply here. It is moved for the other reason.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to PyPI (leave off for a dry run that builds and checks)"
        type: boolean
        default: false
      confirm_version:
        description: "To publish, type the exact version (e.g. 0.1.0). A mismatch aborts."
        type: string
        default: ""
      repository:
        description: "Where to upload"
        type: choice
        options: ["pypi", "testpypi"]
        default: "testpypi"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.publish && 'pypi' || '' }}
    permissions:
      # TRUSTED PUBLISHING, not an API token. PyPI mints a short-lived credential from this
      # workflow's OIDC identity, so there is no long-lived secret to store, leak or rotate — which
      # matters more here than usual, since a token pasted into a chat window is exactly how this
      # project has already lost one. Configure the publisher once at
      # pypi.org/manage/project/swfte-nexus-sdk/settings/publishing: owner SwfteAI, repository
      # nexus-sdk, workflow release.yml, environment pypi.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `actions/setup-python`, not `uv`. The objection to this action was that it installs into a
      # system tool cache and needs root, which the self-hosted runner — an ordinary login account —
      # could not give it (`sudo: a password is required`). That was a property of that machine, not
      # of the action, and it does not apply on a hosted runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Before anything is built. A version that disagrees between the packaging metadata and the
      # module is a wheel whose events name a different build than the wheel does, and `sdk_version`
      # rides every event this SDK emits.
      - name: The version is the same number everywhere
        id: v
        run: python scripts/check_versions.py >> "$GITHUB_OUTPUT"

      - name: The typed version is the one you asked for
        if: inputs.publish
        env:
          WANT: ${{ inputs.confirm_version }}
          GOT: ${{ steps.v.outputs.version }}
        run: |
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::confirm_version is '$WANT' but this tree is '$GOT' — nothing published"
            exit 1
          fi

      - name: Install test and build tooling
        run: python -m pip install --upgrade pytest build twine

      # The suite gates the upload rather than merely preceding it. A release whose tests were not
      # run is a release nobody can describe afterwards.
      - name: Test
        run: python -m pytest tests/ -q --deselect tests/test_decision_latency.py::test_p99_decision_latency_is_under_the_published_cap

      - name: Build sdist and wheel
        run: python -m build

      - name: Metadata is well-formed
        run: python -m twine check dist/*

      # Both artifacts, named, in the run summary — so what was uploaded is legible from the run
      # itself rather than only from the registry afterwards.
      - name: Provenance
        run: |
          {
            echo "### swfte-nexus-sdk ${{ steps.v.outputs.version }}"
            echo ""
            echo "| artifact | bytes |"
            echo "|---|---|"
            for f in dist/*; do echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"; done
            echo ""
            echo "Upload: **${{ inputs.publish && inputs.repository || 'dry run — nothing uploaded' }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
